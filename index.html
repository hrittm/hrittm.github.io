<body class="theme-matrix crt-active">
  <h1 class="sr-only">Hrittick (@hrittm) - Developer & Philomath Terminal Console</h1>
  
  <!-- CRT Filter Overlay (Covers the entire screen) -->
  <div class="crt-overlay" id="crt-overlay"></div>

  <!-- Full-Screen TTY Workspace -->
  <main class="tty-container" id="terminal-window">
    <section class="tty-screen" id="terminal-screen">
      <div class="terminal-output" id="terminal-output">
        <!-- Interactive Welcome Content Loads Here -->
      </div>
      
      <!-- Interactive Canvas Overlay for Math Visualizations -->
      <div class="canvas-container" id="canvas-container">
        <canvas id="math-canvas"></canvas>
        <button class="close-canvas-btn" id="close-canvas" title="Close Visualization">×</button>
      </div>

      <!-- Prompt Line -->
      <div class="terminal-input-line" id="input-line-container">
        <span class="prompt-symbol">hrittm@dev:~$</span>
        <div class="input-wrapper">
          <span class="input-display" id="input-display"></span><span class="custom-caret" id="custom-caret">&nbsp;</span>
          <input type="text" id="terminal-input" class="hidden-input" autocomplete="off" autofocus spellcheck="false" aria-label="Terminal prompt">
        </div>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="scripts/script.js"></script>
</body>
